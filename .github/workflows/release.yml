name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      # Opens/updates a "Version Packages" PR from pending changesets.
      # npm publishing is OPT-IN (we currently distribute via git tag): when you
      # want to publish to the registry, add `with: { publish: npm run release }`
      # here and set an NPM_TOKEN secret (+ NODE_AUTH_TOKEN env).
      - uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
